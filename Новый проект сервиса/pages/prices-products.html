<!-- iRepair: страница «Стоимость услуг» (/prices/), вариант «данные из услуг сайта»
     (прежний вариант на файле из таблицы — prices.html, оставлен без изменений). H1 выводит CS-Cart — в коде его нет.
     Цены, модели, серии, конфигурации и варианты берутся из услуг (товаров) CS-Cart — из того же файла, что и
     калькулятор на главной: /ajax/calc-prices.php (исходник — main-page/scripts/calc-prices.php, пересборка раз в сутки
     и после правки услуг). Поменяли цену или добавили услугу — страница подхватит сама, перевставлять код не нужно.
     Выбор модели — как в корневых категориях: пилюли серий, нажатие раскрывает модели серии. -->
<div class="irepair-page-prices">
  <div class="g-wrapper">

    <div class="irepair-page-prices__hero">
      <p class="irepair-page-prices__lede">Выберите устройство и модель — покажем актуальные цены на все услуги ремонта. Точная стоимость уточняется после бесплатной диагностики.</p>
    </div>

    <div class="irepair-page-prices__picker">
      <!-- вкладки устройств, серии и модели рисует скрипт по данным -->
      <div class="irepair-page-prices__tabs" data-role="tabs"></div>

      <div class="irepair-page-prices__pills" data-role="models"></div>

      <div class="irepair-page-prices__pills irepair-page-prices__pills_config" data-role="configs" hidden></div>
    </div>

    <h2 class="irepair-page-prices__results-title" data-role="results-title" hidden></h2>

    <div class="irepair-page-prices__results" data-role="results">
      <p class="irepair-page-prices__placeholder" data-role="placeholder">Выберите модель, чтобы увидеть цены</p>
    </div>

    <div class="irepair-page-prices__cta">
      <a class="irepair-page-prices__cta-btn" href="/#form-calc">Рассчитать точную стоимость</a>
      <button type="button" class="irepair-page-prices__cta-btn irepair-page-prices__cta-btn_ghost" data-call-popup-trigger>Заказать звонок</button>
    </div>

  </div>
</div>

<script>
(function () {
  var root = document.querySelector('.irepair-page-prices');
  if (!root) return;

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function smoothScrollToElement(el, duration) {
    var startY = window.pageYOffset || document.documentElement.scrollTop;
    var marginTop = parseFloat(getComputedStyle(el).scrollMarginTop) || 0;
    var targetY = el.getBoundingClientRect().top + startY - marginTop;
    var distance = targetY - startY;
    var startTime = null;
    function step(timestamp) {
      if (startTime === null) startTime = timestamp;
      var progress = Math.min((timestamp - startTime) / duration, 1);
      window.scrollTo(0, startY + distance * easeOutCubic(progress));
      if (progress < 1) {
        requestAnimationFrame(step);
      }
    }
    requestAnimationFrame(step);
  }

  function byRole(name) {
    return root.querySelector('[data-role="' + name + '"]');
  }

  function make(tag, className, text) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  var tabsWrap = byRole('tabs');
  var modelsWrap = byRole('models');
  var configsWrap = byRole('configs');
  var resultsWrap = byRole('results');
  var resultsTitle = byRole('results-title');
  var placeholder = byRole('placeholder');

  // Тот же файл, что у калькулятора на главной (собирается из услуг сайта раз в сутки и после правок услуг):
  //   devices — [ { k: ключ, t: подпись вкладки, m: [модели], g: [ { t: серия, m: [№ моделей] } ] } ]
  //   rows    — [ { d: № устройства, m: [№ моделей], s: услуга, p: цена, o: место в списке, u: ссылка,
  //                c: конфигурация, q: вариант (тип запчасти и т. п.), a: 1 — цена «от» } ]
  var DATA_URL = '/ajax/calc-prices.php';
  var devices = [];
  var rows = [];

  var currentDevice = 0;
  var currentModel = -1;
  var openSeries = -1;
  var configOptions = [];
  var currentConfig = null;

  // --- Конфигурации (логика та же, что в калькуляторе) -------------------------------------------
  // У MacBook и iPad конфигурация записана как «чип | номера моделей». В разных услугах одни и те же номера
  // сгруппированы по-разному, поэтому сравниваем номера, а не строки целиком.
  var A_NUMBER = /^A\d\d\d\d$/;
  var parsedCache = Object.create(null);

  function parseConfig(raw) {
    if (parsedCache[raw]) return parsedCache[raw];
    var bar = raw.lastIndexOf('|');
    var left = bar === -1 ? '' : raw.slice(0, bar).trim();
    var nums = (bar === -1 ? raw : raw.slice(bar + 1)).trim().split(/\s*\/\s*/);
    var parsed = { raw: raw, nums: null, chip: Object.create(null) };
    if (nums.every(function (n) { return A_NUMBER.test(n); })) {
      var chips = left ? left.split(' / ') : [];
      parsed.nums = nums;
      nums.forEach(function (n, i) {
        parsed.chip[n] = chips.length === nums.length ? chips[i].trim() : left;
      });
    }
    parsedCache[raw] = parsed;
    return parsed;
  }

  function rowHasModel(row, device, model) {
    return row.d === device && row.m.indexOf(model) !== -1;
  }

  function matchesConfig(row, option) {
    if (!row.c || !option) return true;
    if (!option.nums) return row.c === option.raw;
    var parsed = parseConfig(row.c);
    return !!parsed.nums && parsed.nums.indexOf(option.nums[0]) !== -1;
  }

  function configSortKey(label) {
    if (/Intel/i.test(label)) return 0;
    var m = label.match(/(\d+)/);
    return m ? Number(m[1]) : 99;
  }

  function getConfigOptions(device, model) {
    var raws = [];
    rows.forEach(function (row) {
      if (row.c && rowHasModel(row, device, model) && raws.indexOf(row.c) === -1) raws.push(row.c);
    });
    var options = [];
    var signature = Object.create(null);   // номер модели → в каких конфигурациях он встречается
    var order = [];
    raws.forEach(function (raw) {
      var parsed = parseConfig(raw);
      if (!parsed.nums) {
        options.push({ raw: raw, nums: null, label: raw });
        return;
      }
      parsed.nums.forEach(function (n) {
        if (!signature[n]) {
          signature[n] = [];
          order.push(n);
        }
        signature[n].push(raw);
      });
    });
    // номера, которые везде встречаются вместе, — одна пилюля
    var groups = Object.create(null);
    var groupOrder = [];
    order.forEach(function (n) {
      var key = signature[n].join('\n');
      if (!groups[key]) {
        groups[key] = [];
        groupOrder.push(key);
      }
      groups[key].push(n);
    });
    groupOrder.forEach(function (key) {
      var nums = groups[key];
      var label = '';
      signature[nums[0]].forEach(function (raw) {
        if (!label && parseConfig(raw).nums.length === nums.length) label = raw;
      });
      if (!label) {
        var chips = [];
        nums.forEach(function (n) {
          var chip = '';
          signature[n].forEach(function (raw) {
            var c = parseConfig(raw).chip[n];
            if (c && (!chip || c.length < chip.length)) chip = c;
          });
          if (chip && chips.indexOf(chip) === -1) chips.push(chip);
        });
        label = (chips.length ? chips.join(' / ') + ' | ' : '') + nums.join(' / ');
      }
      options.push({ raw: '', nums: nums, label: label });
    });
    options.sort(function (a, b) {
      var la = a.label.replace('|', ' ');
      var lb = b.label.replace('|', ' ');
      return (configSortKey(a.label) - configSortKey(b.label)) || (la < lb ? -1 : la > lb ? 1 : 0);
    });
    return options;
  }

  // 12 390 ₽ — разряды и знак рубля через неразрывный пробел, цена всегда в одну строку
  function formatPrice(p, approx) {
    var formatted = String(Math.round(Number(p))).replace(/\B(?=(\d\d\d)+(?!\d))/g, ' ');
    return (approx ? 'от ' : '') + formatted + ' ₽';
  }

  // Разделы прайса — по словам в названии услуги (первое совпавшее правило); остальное — «Другие услуги».
  // Порядок разделов и услуг внутри — как в списке услуг модели на сайте (место услуги в категории).
  var CATEGORY_RULES = [
    [ 'Экран и стекло', /дисплея|матрицы|стекла/i ],
    [ 'Аккумулятор', /аккумулятор/i ],
    [ 'Камера и Face ID', /камеры|face.?id/i ],
    [ 'Звук', /динамик|микрофон/i ],
    [ 'Клавиатура и тачпад', /клавиатур|клавиш|тачпад|тачбар/i ],
    [ 'Разъёмы и кнопки', /разъ[её]ма|шлейфа|кнопок/i ],
    [ 'Корпус', /корпуса/i ],
    [ 'Чистка и защита от влаги', /влаги|пыли|жидкост|термопаст|охлаждени/i ],
    [ 'Накопитель', /ssd|hdd/i ],
    [ 'Плата и питание', /материнской платы|контроллера питания|не включается/i ],
    [ 'Программные услуги', /прошивк|ios|macos|данных|резервной|оригинальност/i ]
  ];

  function categorize(serviceName) {
    for (var i = 0; i < CATEGORY_RULES.length; i++) {
      if (CATEGORY_RULES[i][1].test(serviceName)) return CATEGORY_RULES[i][0];
    }
    return 'Другие услуги';
  }

  // --- Вкладки, серии и модели ---------------------------------------------------------------------
  function buildTabs() {
    tabsWrap.innerHTML = '';
    devices.forEach(function (device, i) {
      var btn = make('button', 'irepair-page-prices__tab' + (i === currentDevice ? ' active' : ''), device.t);
      btn.type = 'button';
      btn.setAttribute('data-device', i);
      tabsWrap.appendChild(btn);
    });
  }

  function seriesOf(device) {
    return (device.g && device.g.length) ? device.g : device.m.map(function (name, i) { return { t: name, m: [i] }; });
  }

  function modelPill(index, extraClass) {
    var btn = make('button', 'irepair-page-prices__pill' + (extraClass ? ' ' + extraClass : ''), devices[currentDevice].m[index]);
    btn.type = 'button';
    btn.setAttribute('data-model', index);
    if (index === currentModel) btn.classList.add('active');
    return btn;
  }

  // Пилюли серий; нажатие раскрывает модели серии сразу под её строкой. Серия из одной модели (MacBook 12)
  // и устройства без серий (часы, iMac) — обычные пилюли моделей.
  function renderModels() {
    modelsWrap.innerHTML = '';
    var device = devices[currentDevice];
    var series = seriesOf(device);
    var hasSeries = series.some(function (g) { return g.m.length > 1; });
    modelsWrap.classList.toggle('irepair-page-prices__pills_series', hasSeries);

    series.forEach(function (group, gi) {
      if (!hasSeries) {
        modelsWrap.appendChild(modelPill(group.m[0]));
        return;
      }
      if (group.m.length === 1) {
        modelsWrap.appendChild(modelPill(group.m[0], 'irepair-page-prices__pill_series'));
        return;
      }
      var btn = make('button', 'irepair-page-prices__pill irepair-page-prices__pill_series', group.t);
      btn.type = 'button';
      btn.setAttribute('data-series', gi);
      btn.setAttribute('aria-expanded', gi === openSeries ? 'true' : 'false');
      if (gi === openSeries) btn.classList.add('is-open');
      if (group.m.indexOf(currentModel) !== -1) btn.classList.add('has-active');
      modelsWrap.appendChild(btn);
      if (gi === openSeries) {
        var panel = make('div', 'irepair-page-prices__panel');
        group.m.forEach(function (mi) { panel.appendChild(modelPill(mi)); });
        modelsWrap.appendChild(panel);
      }
    });
  }

  function selectDevice(index) {
    currentDevice = index;
    var series = seriesOf(devices[index]);
    // сразу показываем цены первой модели: первая серия раскрыта, первая модель выбрана
    openSeries = series.length && series[0].m.length > 1 ? 0 : -1;
    currentModel = series.length ? series[0].m[0] : -1;
    renderModels();
    renderConfigsAndResults();
  }

  function renderConfigsAndResults() {
    configOptions = currentModel === -1 ? [] : getConfigOptions(currentDevice, currentModel);
    configsWrap.innerHTML = '';
    if (configOptions.length > 1) {
      configOptions.forEach(function (option, i) {
        var btn = make('button', 'irepair-page-prices__pill irepair-page-prices__pill_config' + (i === 0 ? ' active' : ''), option.label);
        btn.type = 'button';
        btn.setAttribute('data-config', i);
        configsWrap.appendChild(btn);
      });
      configsWrap.hidden = false;
    } else {
      configsWrap.hidden = true;
    }
    currentConfig = configOptions.length ? configOptions[0] : null;
    renderResults();
  }

  // --- Прайс ---------------------------------------------------------------------------------------
  function renderResults() {
    resultsWrap.innerHTML = '';
    if (currentModel === -1) {
      resultsTitle.hidden = true;
      resultsWrap.appendChild(placeholder);
      return;
    }

    var modelName = devices[currentDevice].m[currentModel];
    var configName = currentConfig && configOptions.length > 1 ? currentConfig.label : '';
    resultsTitle.textContent = 'Цены на ремонт ' + modelName + (configName ? ' · ' + configName : '');
    resultsTitle.hidden = false;

    var options = rows.filter(function (row) {
      return rowHasModel(row, currentDevice, currentModel) && matchesConfig(row, currentConfig);
    });
    if (!options.length) {
      resultsWrap.appendChild(make('p', 'irepair-page-prices__placeholder', 'Для этой модели пока нет цен — уточните стоимость по телефону'));
      return;
    }

    // раздел → услуга → строки вариантов; место раздела и услуги — по самой ранней услуге
    var categories = [];
    var catIndex = Object.create(null);
    options.forEach(function (row) {
      var catName = categorize(row.s);
      if (!(catName in catIndex)) {
        catIndex[catName] = categories.length;
        categories.push({ name: catName, place: row.o, services: [], byName: Object.create(null) });
      }
      var cat = categories[catIndex[catName]];
      if (row.o < cat.place) cat.place = row.o;
      if (!(row.s in cat.byName)) {
        cat.byName[row.s] = cat.services.length;
        cat.services.push({ name: row.s, place: row.o, rows: [] });
      }
      var service = cat.services[cat.byName[row.s]];
      if (row.o < service.place) service.place = row.o;
      service.rows.push(row);
    });
    categories.sort(function (a, b) { return a.place - b.place; });

    function makeDots() {
      return make('span', 'irepair-page-prices__row-dots');
    }

    function makeOrderBtn(catName, serviceName, row) {
      var btn = make('button', 'irepair-page-prices__order', 'Оформить заявку');
      btn.type = 'button';
      btn.setAttribute('data-call-popup-trigger', '');
      btn.setAttribute('aria-label', 'Оформить заявку: ' + serviceName);
      // у варианта могут быть свои скобки («AASP (Замена дисплея в сборе)») — тогда пишем через тире
      var variant = !row.q ? '' : (row.q.indexOf('(') === -1 ? ' (' + row.q + ')' : ' — ' + row.q);
      btn.dataset.service = catName + ' — ' + serviceName + variant + ' — ' + modelName + (configName ? ' · ' + configName : '');
      btn.dataset.price = row.p;
      return btn;
    }

    categories.forEach(function (cat) {
      cat.services.sort(function (a, b) { return a.place - b.place; });

      var block = make('div', 'irepair-page-prices__category');
      block.appendChild(make('h3', 'irepair-page-prices__category-title', cat.name));
      var list = make('div', 'irepair-page-prices__list');

      cat.services.forEach(function (service) {
        service.rows.sort(function (a, b) { return a.p - b.p; });
        var cheapest = service.rows[0];
        var item = make('div', 'irepair-page-prices__row');

        // название услуги — ссылка на её страницу; на телефоне вся строка ведёт туда же
        var main = make('div', 'irepair-page-prices__row-main');
        var mainName = make(cheapest.u ? 'a' : 'span', 'irepair-page-prices__row-name', service.name);
        if (cheapest.u) mainName.setAttribute('href', cheapest.u);
        var mainRight = make('span', 'irepair-page-prices__row-right');
        mainRight.appendChild(make('span', 'irepair-page-prices__row-price',
          formatPrice(cheapest.p, cheapest.a || service.rows.length > 1)));
        mainRight.appendChild(makeOrderBtn(cat.name, service.name, cheapest));
        main.appendChild(mainName);
        main.appendChild(makeDots());
        main.appendChild(mainRight);
        item.appendChild(main);

        if (service.rows.length > 1) {
          service.rows.forEach(function (row) {
            var variant = make('div', 'irepair-page-prices__row-variant');
            var vRight = make('span', 'irepair-page-prices__row-right');
            vRight.appendChild(make('span', '', formatPrice(row.p, row.a)));
            vRight.appendChild(makeOrderBtn(cat.name, service.name, row));
            variant.appendChild(make('span', 'irepair-page-prices__row-vname', row.q || 'Стандарт'));
            variant.appendChild(makeDots());
            variant.appendChild(vRight);
            item.appendChild(variant);
          });
        }

        list.appendChild(item);
      });

      block.appendChild(list);
      resultsWrap.appendChild(block);
    });
  }

  // --- События -------------------------------------------------------------------------------------
  tabsWrap.addEventListener('click', function (e) {
    var btn = e.target.closest('.irepair-page-prices__tab');
    if (!btn || !devices.length) return;
    Array.prototype.forEach.call(tabsWrap.querySelectorAll('.irepair-page-prices__tab'), function (t) {
      t.classList.toggle('active', t === btn);
    });
    selectDevice(Number(btn.getAttribute('data-device')));
  });

  modelsWrap.addEventListener('click', function (e) {
    var btn = e.target.closest('.irepair-page-prices__pill');
    if (!btn) return;

    // серия: раскрыть её модели (повторное нажатие — свернуть); выбранная модель и цены не меняются
    if (btn.hasAttribute('data-series')) {
      var gi = Number(btn.getAttribute('data-series'));
      openSeries = openSeries === gi ? -1 : gi;
      renderModels();
      return;
    }

    currentModel = Number(btn.getAttribute('data-model'));
    // модель без серии выбрана — раскрытую серию сворачиваем, чтобы список оставался компактным
    if (btn.classList.contains('irepair-page-prices__pill_series')) openSeries = -1;
    renderModels();
    renderConfigsAndResults();
    // MacBook, iPad и Watch — после выбора модели сперва прокручиваем к выбору конфигурации
    // (её ещё нужно выбрать), а не сразу к результатам. Без конфигурации — сразу к заголовку.
    setTimeout(function () {
      smoothScrollToElement(configsWrap.hidden ? resultsTitle : configsWrap, 500);
    }, 50);
  });

  configsWrap.addEventListener('click', function (e) {
    var btn = e.target.closest('.irepair-page-prices__pill');
    if (!btn) return;
    currentConfig = configOptions[Number(btn.getAttribute('data-config'))];
    Array.prototype.forEach.call(configsWrap.querySelectorAll('.irepair-page-prices__pill'), function (b) {
      b.classList.toggle('active', b === btn);
    });
    renderResults();
    setTimeout(function () { smoothScrollToElement(resultsTitle, 500); }, 50);
  });

  function showLoadError() {
    placeholder.textContent = 'Не удалось загрузить цены. Позвоните нам — подскажем стоимость.';
  }

  fetch(DATA_URL)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      devices = data.devices || [];
      rows = data.rows || [];
      if (!devices.length) {
        showLoadError();
        return;
      }
      buildTabs();
      selectDevice(0);
    })
    .catch(showLoadError);
})();
</script>

<style>
.irepair-page-prices,
.irepair-page-prices * {
  box-sizing: border-box;
}
.irepair-page-prices {
  margin-top: -20px;
  margin-bottom: 80px;
  padding-top: 32px;
}
.irepair-page-prices .g-wrapper {
  max-width: 1370px;
  margin: 0 auto;
  padding: 0 35px;
}

  .irepair-page-prices .g-wrapper {
    width: 100%;
  }
}
@media (max-width: 767px) {
  .irepair-page-prices .g-wrapper {
    padding: 0 16px;
  }
}
@media (max-width: 374px) {
  .irepair-page-prices .g-wrapper {
    padding: 0 10px;
  }
}

.irepair-page-prices__hero {
  max-width: 720px;
  margin: 0 0 32px;
}
.irepair-page-prices__lede {
  margin: 0;
  font-family: 'Roboto', Arial, sans-serif;
  font-weight: 300;
  font-size: 16px;
  line-height: 1.6;
  color: #6e6e73;
}

.irepair-page-prices__picker {
  max-width: 900px;
  margin: 0 auto 28px;
  padding: 28px 28px 32px;
  border-radius: 28px;
  background: linear-gradient(160deg, #eafaf2 0%, #e3f7f5 45%, #eaf3fb 100%);
}

.irepair-page-prices__tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 18px;
}
.irepair-page-prices__tab {
  flex: 1 1 0;
  min-width: 90px;
  padding: 12px 8px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.7);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.3));
  backdrop-filter: blur(14px) saturate(180%);
  -webkit-backdrop-filter: blur(14px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
  font-family: 'Roboto', Arial, sans-serif;
  font-size: 15px;
  font-weight: 500;
