<div class="irepair-index-calc" id="form-calc">
  <div class="g-wrapper">
    <h2 class="irepair-index-calc__title">Рассчитать стоимость ремонта</h2>

    <div class="irepair-index-calc__card">
      <div class="irepair-index-calc__tabs" data-role="tabs">
        <button type="button" class="irepair-index-calc__tab" data-device="iPhone">iPhone</button>
        <button type="button" class="irepair-index-calc__tab" data-device="Macbook">MacBook</button>
        <button type="button" class="irepair-index-calc__tab" data-device="iPad">iPad</button>
        <button type="button" class="irepair-index-calc__tab" data-device="Watch">Watch</button>
      </div>

      <div class="irepair-index-calc__fields">
        <div class="irepair-index-calc__field irepair-index-calc__field_model">
          <label class="irepair-index-calc__label">Модель</label>
          <select class="irepair-index-calc__select" data-role="model">
            <option value="">Выберите модель</option>
          </select>
        </div>
        <div class="irepair-index-calc__config-field" data-role="config-field" hidden>
          <label class="irepair-index-calc__label">Конфигурация</label>
          <div class="irepair-index-calc__config" data-role="config"></div>
          <select class="irepair-index-calc__select irepair-index-calc__config-select" data-role="config-select">
            <option value="">Выберите конфигурацию</option>
          </select>
        </div>
      </div>

      <div class="irepair-index-calc__field" data-role="service-field">
        <label class="irepair-index-calc__label">Неисправность</label>
        <select class="irepair-index-calc__select" data-role="service" disabled>
          <option value="">Сначала выберите модель</option>
        </select>
      </div>

      <div class="irepair-index-calc__quality-field" data-role="quality-field" hidden>
        <label class="irepair-index-calc__label">Качество запчасти</label>
        <div class="irepair-index-calc__quality" data-role="quality"></div>
        <p class="irepair-index-calc__quality-desc" data-role="quality-desc"></p>
      </div>

      <div class="irepair-index-calc__result" data-role="result" hidden>
        <div class="irepair-index-calc__result-info">
          <span class="irepair-index-calc__result-label">Стоимость ремонта</span>
          <span class="irepair-index-calc__result-price" data-role="price"></span>
        </div>
        <button type="button" class="irepair-index-calc__cta" data-call-popup-trigger>Записаться на ремонт</button>
      </div>

      <p class="irepair-index-calc__hint" data-role="hint">Цена уточняется после диагностики (бесплатно) — точная стоимость может отличаться в зависимости от повреждений.</p>
    </div>
  </div>
</div>


<script>
(function () {
  var root = document.getElementById('form-calc');
  if (!root) return;

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function smoothScrollToElement(el, duration) {
    var startY = window.pageYOffset || document.documentElement.scrollTop;
    var marginTop = parseFloat(getComputedStyle(el).scrollMarginTop) || 0;
    var targetY = el.getBoundingClientRect().top + startY - marginTop;
    var distance = targetY - startY;
    var startTime = null;
    function step(timestamp) {
      if (startTime === null) startTime = timestamp;
      var progress = Math.min((timestamp - startTime) / duration, 1);
      window.scrollTo(0, startY + distance * easeOutCubic(progress));
      if (progress < 1) {
        requestAnimationFrame(step);
      }
    }
    requestAnimationFrame(step);
  }

  var tabsWrap = root.querySelector('[data-role="tabs"]');
  var modelSelect = root.querySelector('[data-role="model"]');
  var configField = root.querySelector('[data-role="config-field"]');
  var configWrap = root.querySelector('[data-role="config"]');
  var configSelectEl = root.querySelector('[data-role="config-select"]');
  var serviceSelect = root.querySelector('[data-role="service"]');
  var qualityField = root.querySelector('[data-role="quality-field"]');
  var qualityWrap = root.querySelector('[data-role="quality"]');
  var qualityDesc = root.querySelector('[data-role="quality-desc"]');
  var resultBlock = root.querySelector('[data-role="result"]');
  var priceEl = root.querySelector('[data-role="price"]');
  var ctaBtn = root.querySelector('.irepair-index-calc__cta');

  var DATA_URL = '/images/content/repair-prices/repair-prices.json';
  var rows = [];
  var index = {};
  var currentDevice = 'iPhone';
  var currentModel = '';
  var currentConfig = '';
  var currentService = '';
  var currentQuality = '';

  var MACBOOK_MODEL_ORDER = [
    'MacBook Pro 16', 'MacBook Pro 15', 'MacBook Pro 14', 'MacBook Pro 13',
    'MacBook Air 15', 'MacBook Air 13', 'MacBook Air 11', 'MacBook 12'
  ];

  function buildIndex() {
    index = { devices: [], models: {} };
    rows.forEach(function (row) {
      if (index.devices.indexOf(row.d) === -1) index.devices.push(row.d);
      var mKey = row.d;
      if (!index.models[mKey]) index.models[mKey] = [];
      if (index.models[mKey].indexOf(row.m) === -1) index.models[mKey].push(row.m);
    });
    if (index.models.Macbook) {
      index.models.Macbook.sort(function (a, b) {
        return MACBOOK_MODEL_ORDER.indexOf(a) - MACBOOK_MODEL_ORDER.indexOf(b);
      });
    }
  }

  // Строка подходит под выбранную конфигурацию, если у неё нет своей
  // конфигурации (услуга не зависит от поколения/чипа) либо она совпадает
  // с выбранной.
  function matchesConfig(row, config) {
    return !row.c || row.c === config;
  }

  // Сортировка пилюль конфигурации по возрастанию: чип MacBook (M1..M5) или
  // размер корпуса Watch (38..49 мм) — в обоих случаях достаточно первого
  // числа в подписи.
  function chipSortKey(label) {
    if (/Intel/i.test(label)) return 0;
    var m = label.match(/(\d+)/);
    return m ? Number(m[1]) : 99;
  }

  function getConfigsForModel(device, model) {
    var configs = [];
    rows.forEach(function (row) {
      if (row.d === device && row.m === model && row.c && configs.indexOf(row.c) === -1) {
        configs.push(row.c);
      }
    });
    configs.sort(function (a, b) { return chipSortKey(a) - chipSortKey(b); });
    return configs;
  }

  function getServicesForSelection(device, model, config) {
    var services = [];
    rows.forEach(function (row) {
      if (row.d === device && row.m === model && matchesConfig(row, config)) {
        if (services.indexOf(row.s) === -1) services.push(row.s);
      }
    });
    return services;
  }

  function getOptionsForSelection(device, model, config, service) {
    var options = rows.filter(function (row) {
      return row.d === device && row.m === model && row.s === service && matchesConfig(row, config);
    });
    options.sort(function (a, b) { return a.p - b.p; });
    return options;
  }

  var QUALITY_DESCRIPTIONS = {
    OEM: 'Высококачественный аналог запчасти',
    AASP: 'Оригинальная сертифицированная запчасть',
    HQ: 'Качественный аналог запчасти'
  };

  function formatPrice(p, approx) {
    var formatted = String(p).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return (approx ? 'от ' : '') + formatted + ' ₽';
  }

  function resetSelect(select, placeholder, disabled) {
    select.innerHTML = '';
    var opt = document.createElement('option');
    opt.value = '';
    opt.textContent = placeholder;
    select.appendChild(opt);
    select.disabled = !!disabled;
  }

  function fillModels() {
    resetSelect(modelSelect, 'Выберите модель', false);
    var models = index.models[currentDevice] || [];
    models.forEach(function (m) {
      var opt = document.createElement('option');
      opt.value = m;
      opt.textContent = m;
      modelSelect.appendChild(opt);
    });
    currentModel = '';
    hideConfig();
    resetSelect(serviceSelect, 'Сначала выберите модель', true);
    hideQuality();
    hideResult();
  }

  function hideConfig() {
    configField.hidden = true;
    configWrap.innerHTML = '';
    resetSelect(configSelectEl, 'Выберите конфигурацию', false);
    currentConfig = '';
  }

  function fillConfigs() {
    var configs = getConfigsForModel(currentDevice, currentModel);
    if (!configs.length) {
      hideConfig();
      return false;
    }
    configWrap.innerHTML = '';
    resetSelect(configSelectEl, 'Выберите конфигурацию', false);
    configs.forEach(function (c) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'irepair-index-calc__config-btn';
      btn.textContent = c;
      btn.dataset.value = c;
      configWrap.appendChild(btn);

      var opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      configSelectEl.appendChild(opt);
    });
    currentConfig = '';
    configField.hidden = false;
    return true;
  }

  function fillServices() {
    var services = getServicesForSelection(currentDevice, currentModel, currentConfig);
    resetSelect(serviceSelect, 'Выберите неисправность', false);
    services.forEach(function (s) {
      var opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      serviceSelect.appendChild(opt);
    });
    currentService = '';
    hideQuality();
    hideResult();
  }

  function hideQuality() {
    qualityField.hidden = true;
    qualityWrap.innerHTML = '';
    qualityDesc.textContent = '';
    currentQuality = '';
  }

  function hideResult() {
    resultBlock.hidden = true;
  }

  function showQualityOrResult() {
    var options = getOptionsForSelection(currentDevice, currentModel, currentConfig, currentService);
    if (options.length > 1) {
      qualityWrap.innerHTML = '';
      options.forEach(function (o, i) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'irepair-index-calc__quality-btn';
        btn.textContent = o.q || 'Стандарт';
        btn.dataset.index = i;
        if (i === 0) btn.classList.add('active');
        qualityWrap.appendChild(btn);
      });
      qualityField.hidden = false;
      updateQualityDesc(options[0]);
      showResult(options[0]);
    } else if (options.length === 1) {
      hideQuality();
      showResult(options[0]);
    } else {
      hideQuality();
      hideResult();
    }
  }

  function showResult(option) {
    priceEl.textContent = formatPrice(option.p, option.approx);
    resultBlock.hidden = false;
    var titleParts = [currentModel];
    if (currentConfig) titleParts.push('(' + currentConfig + ')');
    titleParts.push('—', currentService);
    if (option.q) titleParts.push('(' + option.q + ')');
    ctaBtn.dataset.service = titleParts.join(' ');
    ctaBtn.dataset.price = option.p;
  }

  function updateQualityDesc(option) {
    var desc = option && option.q ? QUALITY_DESCRIPTIONS[option.q] : '';
    qualityDesc.textContent = desc || '';
    qualityDesc.hidden = !desc;
  }

  tabsWrap.addEventListener('click', function (e) {
    var btn = e.target.closest('.irepair-index-calc__tab');
    if (!btn) return;
    currentDevice = btn.dataset.device;
    Array.prototype.forEach.call(tabsWrap.querySelectorAll('.irepair-index-calc__tab'), function (t) {
      t.classList.toggle('active', t === btn);
    });
    fillModels();
  });

  modelSelect.addEventListener('change', function () {
    currentModel = modelSelect.value;
    if (currentModel) {
      if (fillConfigs()) {
        resetSelect(serviceSelect, 'Сначала выберите конфигурацию', true);
        hideQuality();
        hideResult();
      } else {
        fillServices();
      }
    } else {
      hideConfig();
      resetSelect(serviceSelect, 'Сначала выберите модель', true);
      hideQuality();
      hideResult();
    }
  });

  configWrap.addEventListener('click', function (e) {
    var btn = e.target.closest('.irepair-index-calc__config-btn');
    if (!btn) return;
    Array.prototype.forEach.call(configWrap.querySelectorAll('.irepair-index-calc__config-btn'), function (b) {
      b.classList.toggle('active', b === btn);
    });
    currentConfig = btn.dataset.value;
    configSelectEl.value = currentConfig;
    fillServices();
  });

  configSelectEl.addEventListener('change', function () {
    currentConfig = configSelectEl.value;
    Array.prototype.forEach.call(configWrap.querySelectorAll('.irepair-index-calc__config-btn'), function (b) {
      b.classList.toggle('active', b.dataset.value === currentConfig);
    });
    if (currentConfig) {
      fillServices();
    } else {
      resetSelect(serviceSelect, 'Сначала выберите конфигурацию', true);
      hideQuality();
      hideResult();
    }
  });

  function scrollToBlockTop() {
    smoothScrollToElement(root, 600);
  }

  serviceSelect.addEventListener('change', function () {
    currentService = serviceSelect.value;
    if (currentService) {
      showQualityOrResult();
      // небольшая задержка: на мобильных браузер сам мгновенно доскролливает
      // страницу к закрывшемуся select — даём этому отработать первым
      setTimeout(scrollToBlockTop, 150);
    } else {
      hideQuality();
      hideResult();
    }
  });

  qualityWrap.addEventListener('click', function (e) {
    var btn = e.target.closest('.irepair-index-calc__quality-btn');
    if (!btn) return;
    Array.prototype.forEach.call(qualityWrap.querySelectorAll('.irepair-index-calc__quality-btn'), function (b) {
      b.classList.toggle('active', b === btn);
    });
    var options = getOptionsForSelection(currentDevice, currentModel, currentConfig, currentService);
    var option = options[Number(btn.dataset.index)];
    if (option) {
      showResult(option);
      updateQualityDesc(option);
    }
  });

  fetch(DATA_URL)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      rows = data;
      buildIndex();
      var firstTab = tabsWrap.querySelector('.irepair-index-calc__tab');
      firstTab.classList.add('active');
      fillModels();
    })
    .catch(function () {
      var hint = root.querySelector('[data-role="hint"]');
      hint.textContent = 'Не удалось загрузить калькулятор. Позвоните нам — подберём цену вручную.';
    });
})();
</script>
