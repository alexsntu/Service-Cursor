<!-- iRepair: главная — калькулятор стоимости ремонта, вариант «данные из услуг сайта»
     (прежний вариант на файле из таблицы — index-calculator.html, оставлен без изменений).
     Цены, модели, конфигурации, типы запчастей, гарантия и время берутся из услуг (товаров) CS-Cart:
     их раз в сутки собирает в один файл /ajax/calc-prices.php (исходник — main-page/scripts/calc-prices.php).
     Поменяли цену или добавили услугу в админке — калькулятор подхватит сам, перевставлять блок не нужно.
     Вкладки устройств, порядок моделей и услуг — тоже из данных (порядок как в каталоге сайта). -->
<div class="irepair-index-calc" id="form-calc">
  <div class="g-wrapper">
    <h2 class="irepair-index-calc__title">Рассчитать стоимость ремонта</h2>

    <div class="irepair-index-calc__card">
      <!-- вкладки рисует скрипт по списку устройств из данных -->
      <div class="irepair-index-calc__tabs" data-role="tabs"></div>

      <!-- все выборы — выпадающие списки; на ПК в одну строку, на телефоне столбиком -->
      <div class="irepair-index-calc__fields">
        <div class="irepair-index-calc__field irepair-index-calc__field_model">
          <label class="irepair-index-calc__label">Модель</label>
          <select class="irepair-index-calc__select" data-role="model" disabled>
            <option value="">Выберите модель</option>
          </select>
        </div>
        <div class="irepair-index-calc__field irepair-index-calc__field_config" data-role="config-field" hidden>
          <label class="irepair-index-calc__label" data-role="config-label">Конфигурация</label>
          <select class="irepair-index-calc__select" data-role="config-select">
            <option value="">Выберите конфигурацию</option>
          </select>
        </div>
        <div class="irepair-index-calc__field irepair-index-calc__field_service" data-role="service-field">
          <label class="irepair-index-calc__label">Неисправность</label>
          <select class="irepair-index-calc__select" data-role="service" disabled>
            <option value="">Сначала выберите модель</option>
          </select>
        </div>
        <div class="irepair-index-calc__field irepair-index-calc__field_quality" data-role="quality-field" hidden>
          <label class="irepair-index-calc__label" data-role="quality-label">Тип запчасти</label>
          <select class="irepair-index-calc__select" data-role="quality-select"></select>
        </div>
      </div>
      <p class="irepair-index-calc__quality-desc" data-role="quality-desc" hidden></p>

      <!-- ПК: «Стоимость ремонта» — цена — кнопка в одну линию; телефон: столбиком с равными отступами -->
      <div class="irepair-index-calc__result" data-role="result" hidden>
        <span class="irepair-index-calc__result-label">Стоимость ремонта</span>
        <span class="irepair-index-calc__result-price" data-role="price"></span>
        <button type="button" class="irepair-index-calc__cta" data-call-popup-trigger>Записаться на ремонт</button>
      </div>

      <!-- под ценой: гарантия и время ремонта из услуги + ссылка на её страницу -->
      <p class="irepair-index-calc__meta" data-role="meta" hidden>
        <span class="irepair-index-calc__meta-item" data-role="meta-warranty" hidden></span>
        <span class="irepair-index-calc__meta-item" data-role="meta-time" hidden></span>
        <a class="irepair-index-calc__meta-link" data-role="meta-link" href="/catalog/" hidden>Подробнее об услуге <svg width="6" height="12" viewBox="0 0 6 12" fill="none" aria-hidden="true"><path d="M1 1.5L5 6L1 10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </p>

      <p class="irepair-index-calc__hint" data-role="hint">Цена уточняется после диагностики (бесплатно) — точная стоимость может отличаться в зависимости от повреждений.</p>
    </div>
  </div>
</div>

<script>
(function () {
  var root = document.getElementById('form-calc');
  if (!root) return;

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function smoothScrollToElement(el, duration) {
    var startY = window.pageYOffset || document.documentElement.scrollTop;
    var marginTop = parseFloat(getComputedStyle(el).scrollMarginTop) || 0;
    var targetY = el.getBoundingClientRect().top + startY - marginTop;
    var distance = targetY - startY;
    var startTime = null;
    function step(timestamp) {
      if (startTime === null) startTime = timestamp;
      var progress = Math.min((timestamp - startTime) / duration, 1);
      window.scrollTo(0, startY + distance * easeOutCubic(progress));
      if (progress < 1) {
        requestAnimationFrame(step);
      }
    }
    requestAnimationFrame(step);
  }

  function byRole(name) {
    return root.querySelector('[data-role="' + name + '"]');
  }

  var tabsWrap = byRole('tabs');
  var modelSelect = byRole('model');
  var configField = byRole('config-field');
  var configLabel = byRole('config-label');
  var configSelectEl = byRole('config-select');
  var serviceSelect = byRole('service');
  var qualityField = byRole('quality-field');
  var qualityLabel = byRole('quality-label');
  var qualitySelect = byRole('quality-select');
  var qualityDesc = byRole('quality-desc');
  var resultBlock = byRole('result');
  var priceEl = byRole('price');
  var metaBlock = byRole('meta');
  var metaWarranty = byRole('meta-warranty');
  var metaTime = byRole('meta-time');
  var metaLink = byRole('meta-link');
  var ctaBtn = root.querySelector('.irepair-index-calc__cta');

  // Файл собирается из услуг сайта раз в сутки (и после правок услуг в админке):
  //   devices — [ { k: ключ, t: подпись вкладки, cl: подпись выбора конфигурации, m: [модели] } ]
  //   rows    — [ { d: № устройства, m: [№ моделей], s: услуга, p: цена, o: место в списке, u: ссылка,
  //                c: конфигурация, q: вариант (тип запчасти и т. п.), ql: подпись варианта, n: № пояснения,
  //                a: 1 — цена «от», w: гарантия, t: время ремонта } ]
  //   notes   — пояснения к вариантам
  var DATA_URL = '/ajax/calc-prices.php';
  var devices = [];
  var rows = [];
  var notes = [];

  var currentDevice = 0;
  var currentModel = -1;
  var configOptions = [];
  var currentConfig = null;
  var currentService = '';

  // --- Конфигурации -------------------------------------------------------------------------------
  // У MacBook и iPad конфигурация записана как «чип | номера моделей»: «M5 | A3434»,
  // «M5 / M5 Pro / M5 Max | A3434 / A3426 / A3427». В разных услугах одни и те же номера сгруппированы
  // по-разному, поэтому сравниваем не строки целиком, а номера: клиент выбирает свой номер модели и видит
  // все услуги, где этот номер есть. Остальные конфигурации (размер корпуса часов и т. п.) — как есть.
  var A_NUMBER = /^A\d\d\d\d$/;   // квантификатор в фигурных скобках не пишем: блок со Smarty его вырезает
  var parsedCache = Object.create(null);

  function parseConfig(raw) {
    if (parsedCache[raw]) return parsedCache[raw];
    var bar = raw.lastIndexOf('|');
    var left = bar === -1 ? '' : raw.slice(0, bar).trim();
    var nums = (bar === -1 ? raw : raw.slice(bar + 1)).trim().split(/\s*\/\s*/);
    var parsed = { raw: raw, nums: null, chip: Object.create(null) };
    if (nums.every(function (n) { return A_NUMBER.test(n); })) {
      var chips = left ? left.split(' / ') : [];
      parsed.nums = nums;
      nums.forEach(function (n, i) {
        parsed.chip[n] = chips.length === nums.length ? chips[i].trim() : left;
      });
    }
    parsedCache[raw] = parsed;
    return parsed;
  }

  function rowHasModel(row, device, model) {
    return row.d === device && row.m.indexOf(model) !== -1;
  }

  // Строка подходит под выбранную конфигурацию, если у неё нет своей конфигурации
  // (услуга не зависит от поколения/чипа) либо в ней есть выбранный номер модели.
  function matchesConfig(row, option) {
    if (!row.c || !option) return true;
    if (!option.nums) return row.c === option.raw;
    var parsed = parseConfig(row.c);
    return !!parsed.nums && parsed.nums.indexOf(option.nums[0]) !== -1;
  }

  // Сортировка конфигураций по возрастанию: чип MacBook (Intel, M1..M5), поколение iPad,
  // размер корпуса Watch — во всех случаях достаточно первого числа в подписи.
  function configSortKey(label) {
    if (/Intel/i.test(label)) return 0;
    var m = label.match(/(\d+)/);
    return m ? Number(m[1]) : 99;
  }

  function getConfigOptions(device, model) {
    var raws = [];
    rows.forEach(function (row) {
      if (row.c && rowHasModel(row, device, model) && raws.indexOf(row.c) === -1) raws.push(row.c);
    });
    var options = [];
    var signature = Object.create(null);   // номер модели → в каких конфигурациях он встречается
    var order = [];
    raws.forEach(function (raw) {
      var parsed = parseConfig(raw);
      if (!parsed.nums) {
        options.push({ raw: raw, nums: null, label: raw });
        return;
      }
      parsed.nums.forEach(function (n) {
        if (!signature[n]) {
          signature[n] = [];
          order.push(n);
        }
        signature[n].push(raw);
      });
    });
    // номера, которые везде встречаются вместе, — один пункт списка
    var groups = Object.create(null);
    var groupOrder = [];
    order.forEach(function (n) {
      var key = signature[n].join('\n');
      if (!groups[key]) {
        groups[key] = [];
        groupOrder.push(key);
      }
      groups[key].push(n);
    });
    groupOrder.forEach(function (key) {
      var nums = groups[key];
      var label = '';
      // если группа совпала с конфигурацией одной из услуг — подпись берём оттуда без изменений
      signature[nums[0]].forEach(function (raw) {
        if (!label && parseConfig(raw).nums.length === nums.length) label = raw;
      });
      if (!label) {
        var chips = [];
        nums.forEach(function (n) {
          var chip = '';
          signature[n].forEach(function (raw) {
            var c = parseConfig(raw).chip[n];
            if (c && (!chip || c.length < chip.length)) chip = c;
          });
          if (chip && chips.indexOf(chip) === -1) chips.push(chip);
        });
        label = (chips.length ? chips.join(' / ') + ' | ' : '') + nums.join(' / ');
      }
      options.push({ raw: '', nums: nums, label: label });
    });
    options.sort(function (a, b) {
      // при равном числе короткая подпись раньше: «M5 | …» перед «M5 Pro / M5 Max | …»
      var la = a.label.replace('|', ' ');
      var lb = b.label.replace('|', ' ');
      return (configSortKey(a.label) - configSortKey(b.label)) || (la < lb ? -1 : la > lb ? 1 : 0);
    });
    return options;
  }

  // --- Услуги и варианты ---------------------------------------------------------------------------
  // Порядок услуг — как в списке услуг модели на сайте (место услуги в категории).
  function getServices(device, model, config) {
    var names = [];
    var place = Object.create(null);
    rows.forEach(function (row) {
      if (!rowHasModel(row, device, model) || !matchesConfig(row, config)) return;
      if (!(row.s in place)) {
        names.push(row.s);
        place[row.s] = row.o;
      } else if (row.o < place[row.s]) {
        place[row.s] = row.o;
      }
    });
    var firstPos = names.slice();
    names.sort(function (a, b) {
      return (place[a] - place[b]) || (firstPos.indexOf(a) - firstPos.indexOf(b));
    });
    return names;
  }

  function getOptions(device, model, config, service) {
    var options = rows.filter(function (row) {
      return row.s === service && rowHasModel(row, device, model) && matchesConfig(row, config);
    });
    options.sort(function (a, b) { return a.p - b.p; });
    return options;
  }

  // 12 390 ₽ — разряды и знак рубля через неразрывный пробел (записан как  : редактор CS-Cart
  // портит сам символ nbsp в коде блока) — цена всегда в одну строку
  function formatPrice(p, approx) {
    var formatted = String(Math.round(Number(p))).replace(/\B(?=(\d\d\d)+(?!\d))/g, ' ');
    return (approx ? 'от ' : '') + formatted + ' ₽';
  }

  // --- Отрисовка -----------------------------------------------------------------------------------
  function resetSelect(select, placeholder, disabled) {
    select.innerHTML = '';
    var opt = document.createElement('option');
    opt.value = '';
    opt.textContent = placeholder;
    select.appendChild(opt);
    select.disabled = !!disabled;
  }

  function addOption(select, value, text) {
    var opt = document.createElement('option');
    opt.value = value;
    opt.textContent = text;
    select.appendChild(opt);
  }

  function buildTabs() {
    tabsWrap.innerHTML = '';
    devices.forEach(function (device, i) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'irepair-index-calc__tab' + (i === currentDevice ? ' active' : '');
      btn.setAttribute('data-device', i);
      btn.textContent = device.t;
      tabsWrap.appendChild(btn);
    });
  }

  function fillModels() {
    resetSelect(modelSelect, 'Выберите модель', false);
    devices[currentDevice].m.forEach(function (name, i) {
      addOption(modelSelect, i, name);
    });
    currentModel = -1;
    hideConfig();
    resetSelect(serviceSelect, 'Сначала выберите модель', true);
    hideQuality();
    hideResult();
  }

  function hideConfig() {
    configField.hidden = true;
    resetSelect(configSelectEl, 'Выберите конфигурацию', false);
    configOptions = [];
    currentConfig = null;
  }

  // true — показан выбор конфигурации и клиент должен её выбрать
  function fillConfigs() {
    hideConfig();
    configOptions = getConfigOptions(currentDevice, currentModel);
    if (configOptions.length === 1) {
      currentConfig = configOptions[0];   // выбирать не из чего — подставляем молча
      return false;
    }
    if (!configOptions.length) return false;
    configLabel.textContent = devices[currentDevice].cl || 'Конфигурация';
    configOptions.forEach(function (option, i) {
      addOption(configSelectEl, i, option.label);
    });
    configField.hidden = false;
    return true;
  }

  function fillServices() {
    resetSelect(serviceSelect, 'Выберите неисправность', false);
    getServices(currentDevice, currentModel, currentConfig).forEach(function (name) {
      addOption(serviceSelect, name, name);
    });
    currentService = '';
    hideQuality();
    hideResult();
  }

  function hideQuality() {
    qualityField.hidden = true;
    qualitySelect.innerHTML = '';
    qualityDesc.textContent = '';
    qualityDesc.hidden = true;
  }

  function hideResult() {
    resultBlock.hidden = true;
    metaBlock.hidden = true;
  }

  function showQualityOrResult() {
    var options = getOptions(currentDevice, currentModel, currentConfig, currentService);
    if (options.length > 1) {
      var label = options[0].ql || 'Вариант';
      qualitySelect.innerHTML = '';
      options.forEach(function (o, i) {
        addOption(qualitySelect, i, o.q || 'Стандарт');
        if ((o.ql || 'Вариант') !== label) label = 'Вариант';
      });
      qualityLabel.textContent = label;
      qualitySelect.value = '0';
      qualityField.hidden = false;
      updateQualityDesc(options[0]);
      showResult(options[0]);
    } else if (options.length === 1) {
      hideQuality();
      showResult(options[0]);
    } else {
      hideQuality();
      hideResult();
    }
  }

  function showResult(option) {
    priceEl.textContent = formatPrice(option.p, option.a);
    resultBlock.hidden = false;

    metaWarranty.textContent = option.w ? 'Гарантия: ' + option.w : '';
    metaWarranty.hidden = !option.w;
    metaTime.textContent = option.t ? 'Время ремонта: ' + option.t : '';
    metaTime.hidden = !option.t;
    if (option.u) metaLink.setAttribute('href', option.u);
    metaLink.hidden = !option.u;
    metaBlock.hidden = !(option.w || option.t || option.u);

    // название для заявки: «iPhone 17 — Замена дисплея (OEM)»
    var titleParts = [devices[currentDevice].m[currentModel]];
    if (currentConfig && configOptions.length > 1) titleParts.push('(' + currentConfig.label + ')');
    titleParts.push('—', currentService);
    // у варианта могут быть свои скобки («AASP (Замена дисплея в сборе)») — тогда пишем через тире, без двойных скобок
    if (option.q) {
      if (option.q.indexOf('(') === -1) titleParts.push('(' + option.q + ')');
      else titleParts.push('—', option.q);
    }
    ctaBtn.dataset.service = titleParts.join(' ');
    ctaBtn.dataset.price = option.p;
  }

  function updateQualityDesc(option) {
    var desc = option && typeof option.n === 'number' ? notes[option.n] : '';
    qualityDesc.textContent = desc || '';
    qualityDesc.hidden = !desc;
  }

  // --- События -------------------------------------------------------------------------------------
  tabsWrap.addEventListener('click', function (e) {
    var btn = e.target.closest('.irepair-index-calc__tab');
    if (!btn || !devices.length) return;
    currentDevice = Number(btn.getAttribute('data-device'));
    Array.prototype.forEach.call(tabsWrap.querySelectorAll('.irepair-index-calc__tab'), function (t) {
      t.classList.toggle('active', t === btn);
    });
    fillModels();
  });

  modelSelect.addEventListener('change', function () {
    currentModel = modelSelect.value === '' ? -1 : Number(modelSelect.value);
    if (currentModel !== -1) {
      if (fillConfigs()) {
        resetSelect(serviceSelect, 'Сначала выберите конфигурацию', true);
        hideQuality();
        hideResult();
      } else {
        fillServices();
      }
    } else {
      hideConfig();
      resetSelect(serviceSelect, 'Сначала выберите модель', true);
      hideQuality();
      hideResult();
    }
  });

  configSelectEl.addEventListener('change', function () {
    currentConfig = configSelectEl.value === '' ? null : configOptions[Number(configSelectEl.value)];
    if (currentConfig) {
      fillServices();
    } else {
      resetSelect(serviceSelect, 'Сначала выберите конфигурацию', true);
      hideQuality();
      hideResult();
    }
  });

  function scrollToBlockTop() {
    smoothScrollToElement(root, 600);
  }

  serviceSelect.addEventListener('change', function () {
    currentService = serviceSelect.value;
    if (currentService) {
      showQualityOrResult();
      // небольшая задержка: на мобильных браузер сам мгновенно доскролливает
      // страницу к закрывшемуся select — даём этому отработать первым
      setTimeout(scrollToBlockTop, 150);
    } else {
      hideQuality();
      hideResult();
    }
  });

  qualitySelect.addEventListener('change', function () {
    var options = getOptions(currentDevice, currentModel, currentConfig, currentService);
    var option = options[Number(qualitySelect.value)];
    if (option) {
      showResult(option);
      updateQualityDesc(option);
    }
  });

  function showLoadError() {
    byRole('hint').textContent = 'Не удалось загрузить калькулятор. Позвоните нам — подберём цену вручную.';
  }

  fetch(DATA_URL)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      devices = data.devices || [];
      rows = data.rows || [];
      notes = data.notes || [];
      if (!devices.length) {
        showLoadError();
        return;
      }
      currentDevice = 0;
      buildTabs();
      fillModels();
    })
    .catch(showLoadError);
})();
</script>

<style>
.irepair-index-calc,
.irepair-index-calc * {
  box-sizing: border-box;
}
.irepair-index-calc {
  width: 100vw;
  position: relative;
  left: 50%;
  margin: -20px 0 80px;
  margin-left: -50vw;
  margin-right: -50vw;
  background: linear-gradient(160deg, #f4fff8, #edfafa);
  padding: 32px 0 64px;
  scroll-margin-top: 100px;
}
.irepair-index-calc .g-wrapper {
  max-width: 1370px;
  margin: 0 auto;
  padding: 0 35px;
}
@media (max-width: 1370px) {
  .irepair-index-calc .g-wrapper {
    width: 100%;
  }
}
@media (max-width: 767px) {
  .irepair-index-calc .g-wrapper {
    padding: 0 16px;
  }
}
@media (max-width: 374px) {
  .irepair-index-calc .g-wrapper {
    padding: 0 10px;
  }
}

.irepair-index-calc .irepair-index-calc__title {
  margin: 0 0 40px;
  text-align: center;
  font-family: 'Montserrat-SemiBold', Arial, sans-serif;
  font-size: 38px;
  line-height: 1.15;
  color: #1d1d1f;
  font-weight: 400;
  text-transform: none;
}

.irepair-index-calc__card {
  max-width: 1200px;
  margin: 0 auto;
  background: #fff;
  border-radius: 28px;
  padding: 48px 56px;
  box-shadow: 0 20px 50px rgba(32, 204, 190, 0.12);
}

.irepair-index-calc__tabs {
  display: flex;
  gap: 8px;
  background: #f2f5f4;
  border-radius: 999px;
  padding: 6px;
  margin-bottom: 28px;
}

  border: none;

  padding: 12px 8px;

/* все выборы — выпадающие списки в одну строку (на узких экранах переносятся) */
.irepair-index-calc__field {
  display: flex;
  flex-direction: column;
  flex: 1 1 200px;
