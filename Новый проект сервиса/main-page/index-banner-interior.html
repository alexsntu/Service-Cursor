<!-- iRepair: главная — главный баннер, вариант на фото сервиса
     (прежний вариант — index-banner.html, оставлен без изменений).
     Компьютер: высота 375 px, от шапки — 10 px. Левая часть чёрная с текстом, фото стоит справа и от середины
     баннера плавно уходит в темноту к левому краю. Фото не растягивается: кадр сделан с запасом под чёткие экраны.
     Телефон: фото во весь баннер, заголовок сверху, кнопка снизу, высота 380 px.
     Сейчас стоит фото зала ожидания со стеной iRepair: /images/content/index-banner/lounge-desktop.webp и
     lounge-mobile.webp. На сервере лежат ещё два набора — чтобы сменить фото, достаточно заменить в коде
     слово lounge (оно встречается два раза) на:
       reception — стойка с мастерами и стена iRepair (кадр из готового баннера 1920 × 768);
       master    — мастер за стойкой и клиент. -->

<script>
(function () {
  var cta = document.querySelector('.irepair-index-banner__cta');
  if (!cta) return;

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function smoothScrollToElement(el, duration) {
    var startY = window.pageYOffset || document.documentElement.scrollTop;
    var marginTop = parseFloat(getComputedStyle(el).scrollMarginTop) || 0;
    var targetY = el.getBoundingClientRect().top + startY - marginTop;
    var distance = targetY - startY;
    var startTime = null;
    function step(timestamp) {
      if (startTime === null) startTime = timestamp;
      var progress = Math.min((timestamp - startTime) / duration, 1);
      window.scrollTo(0, startY + distance * easeOutCubic(progress));
      if (progress < 1) {
        requestAnimationFrame(step);
      }
    }
    requestAnimationFrame(step);
  }

  cta.addEventListener('click', function (e) {
    var targetId = (cta.getAttribute('href') || '').replace('#', '');
    var target = targetId && document.getElementById(targetId);
    if (!target) return;
    e.preventDefault();
    smoothScrollToElement(target, 600);
  });
})();
</script>
