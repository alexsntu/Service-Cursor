<!-- iRepair: главная — блок «iRepair в цифрах», вариант «сторис» на фото сотрудников и сервиса
     (прежний вариант с иконками — index-stats.html, оставлен без изменений).
     Четыре вертикальные карточки 3:4: фото во всю карточку, снизу затемнение, поверх — число, подпись и пояснение.
     Компьютер: 4 в ряд. Телефон: лента с прокруткой пальцем, следующая карточка выглядывает.
     Числа «набегают» от нуля, когда блок появляется на экране; клиенты и годы считаются сами (как в прежнем блоке).
     Фото: /images/content/index-stats/*.webp (720 × 960). -->
<div class="irepair-index-facts">
  <div class="g-wrapper">
    <h2 class="irepair-index-facts__title">iRepair в цифрах</h2>
  </div>
  <div class="irepair-index-facts__scroller">
    <div class="irepair-index-facts__track">

      <div class="irepair-index-facts__card">
        <img class="irepair-index-facts__img" src="/images/content/index-stats/clients.webp" alt="Мастер iRepair с отремонтированным MacBook" width="720" height="960" loading="lazy">
        <span class="irepair-index-facts__text">
          <span class="irepair-index-facts__number" data-role="stat-clients">54&nbsp;000</span>
          <span class="irepair-index-facts__label">Довольных клиентов</span>
          <span class="irepair-index-facts__sublabel">Растём каждый час</span>
        </span>
      </div>

      <div class="irepair-index-facts__card">
        <img class="irepair-index-facts__img" src="/images/content/index-stats/years.webp" alt="Команда сервисного центра iRepair" width="720" height="960" loading="lazy">
        <span class="irepair-index-facts__text">
          <span class="irepair-index-facts__number" data-role="stat-years">15</span>
          <span class="irepair-index-facts__label">Лет опыта</span>
          <span class="irepair-index-facts__sublabel">Сервис открыт с 2011</span>
        </span>
      </div>

      <div class="irepair-index-facts__card">
        <img class="irepair-index-facts__img" src="/images/content/index-stats/minutes.webp" alt="Инженер iRepair за микроскопом" width="720" height="960" loading="lazy">
        <span class="irepair-index-facts__text">
          <span class="irepair-index-facts__number" data-static="45">45</span>
          <span class="irepair-index-facts__label">Минут</span>
          <span class="irepair-index-facts__sublabel">Среднее время ремонта</span>
        </span>
      </div>

      <div class="irepair-index-facts__card">
        <img class="irepair-index-facts__img" src="/images/content/index-stats/hours.webp" alt="Мастера iRepair" width="720" height="960" loading="lazy">
        <span class="irepair-index-facts__text">
          <span class="irepair-index-facts__number" data-static="168">168</span>
          <span class="irepair-index-facts__label">Часов в неделю</span>
          <span class="irepair-index-facts__sublabel">Мы думаем о вас</span>
        </span>
      </div>

    </div>
  </div>
</div>

<script>
(function () {
  var section = document.querySelector('.irepair-index-facts');
  if (!section) return;

  var clientsEl = section.querySelector('[data-role="stat-clients"]');
  var yearsEl = section.querySelector('[data-role="stat-years"]');

  var startYear = 2011;
  var totalYears = new Date().getFullYear() - startYear;

  var baseClients = 54000;
  var startDate = new Date('2024-01-01T00:00:00').getTime();
  var totalClients = baseClients + Math.floor((Date.now() - startDate) / (1000 * 60 * 60));

  function animateValue(el, end, duration) {
    if (!el) return;
    var startTimestamp = null;
    function step(timestamp) {
      if (!startTimestamp) startTimestamp = timestamp;
      var progress = Math.min((timestamp - startTimestamp) / duration, 1);
      el.textContent = Math.floor(progress * end).toLocaleString('ru-RU');
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function runAnimations() {
    animateValue(clientsEl, totalClients, 2500);
    animateValue(yearsEl, totalYears, 1500);
    var staticEls = section.querySelectorAll('[data-static]');
    for (var i = 0; i < staticEls.length; i++) {
      animateValue(staticEls[i], parseInt(staticEls[i].getAttribute('data-static'), 10), 2000);
    }
  }

  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          runAnimations();
          observer.disconnect();
        }
      });
    }, { threshold: 0.3 });
    observer.observe(section);
  } else {
    runAnimations();
  }
})();
</script>

</style>
