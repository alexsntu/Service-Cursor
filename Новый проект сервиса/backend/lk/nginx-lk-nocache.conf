# iRepair: файлы личного кабинета (/ajax/lk/*.js, *.css) — без суточного кэша: браузер каждый раз сверяет версию
# (ответ 304, если файл не менялся). Иначе после правок клиенты сутки работали бы со старым кодом.
# Отдельный location с вложенными правилами: общее правило статики сидит внутри «location /» и иначе перебивает.
# При переезде на боевой домен перенести этот файл (строку X-Robots-Tag там убрать).
location ^~ /ajax/lk/ {
	location ~ [^/]\.ph(p\d*|tml)$ {
		try_files /does_not_exists @php;
	}
	location ~* \.(js|css)$ {
		add_header Cache-Control "no-cache";
		add_header X-Robots-Tag "noindex, nofollow" always;
	}
}
